name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build and test all services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run unit tests
        run: mvn -B verify

  frontend:
    name: Frontend (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker (compose file and images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        working-directory: infrastructure
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci/; s/^JWT_SECRET=.*/JWT_SECRET=Y2k=/' .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      # One service image proves the shared Dockerfile; every service builds the same way.
      - name: Build the payment-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=payment-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the storefront image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

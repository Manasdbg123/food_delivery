version: '3.8'

x-db-env: &db-env
  DB_USERNAME: root
  DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-manas@9546}

x-common-env: &common-env
  EUREKA_URI: http://discovery-server:8761/eureka/
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-manas@9546}
      MYSQL_DATABASE: user_db
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-manas@9546}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  discovery-server:
    build:
      context: ..
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      - discovery-server

  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/user_db?allowPublicKeyRetrieval=true&useSSL=false
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/user_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started

  restaurant-service:
    build:
      context: ..
      dockerfile: restaurant-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/restaurant_db?allowPublicKeyRetrieval=true&useSSL=false
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      discovery-server:
        condition: service_started

  menu-service:
    build:
      context: ..
      dockerfile: menu-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/menu_db?allowPublicKeyRetrieval=true&useSSL=false
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      discovery-server:
        condition: service_started

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started
      restaurant-service:
        condition: service_started

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started

  delivery-service:
    build:
      context: ..
      dockerfile: delivery-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/delivery_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    ports:
      - "8088:8088"
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_started
      discovery-server:
        condition: service_started

volumes:
  mysql_data:

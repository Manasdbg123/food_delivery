# FoodieHub: the whole platform on one host.
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose up -d --build
#
# The storefront is published on HTTP_PORT (80 by default) and proxies /api to the
# gateway. Databases, Kafka and the services are reachable only inside this network;
# the few ports opened for local debugging are bound to 127.0.0.1.

name: foodiehub

x-service: &service
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512m

x-common-env: &common-env
  EUREKA_URI: http://discovery-server:8761/eureka/
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError

x-db-env: &db-env
  DB_USERNAME: root
  DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infrastructure/.env}

x-depends-core: &depends-core
  mysql:
    condition: service_healthy
  kafka:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infrastructure/.env}
      MYSQL_DATABASE: user_db
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # A single broker cannot keep three copies of its internal topics.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  discovery-server:
    <<: *service
    build: { context: .., args: { SERVICE: discovery-server } }
    image: foodiehub/discovery-server
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
    healthcheck: &health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  api-gateway:
    <<: *service
    build: { context: .., args: { SERVICE: api-gateway } }
    image: foodiehub/api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]

  auth-service:
    <<: *service
    build: { context: .., args: { SERVICE: auth-service } }
    image: foodiehub/auth-service
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/user_db?allowPublicKeyRetrieval=true&useSSL=false
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/.env}
    depends_on: *depends-core
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]

  user-service:
    <<: *service
    build: { context: .., args: { SERVICE: user-service } }
    image: foodiehub/user-service
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/user_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on: *depends-core
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP"]

  restaurant-service:
    <<: *service
    build: { context: .., args: { SERVICE: restaurant-service } }
    image: foodiehub/restaurant-service
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/restaurant_db?allowPublicKeyRetrieval=true&useSSL=false
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      <<: *depends-core
      redis:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q UP"]

  menu-service:
    <<: *service
    build: { context: .., args: { SERVICE: menu-service } }
    image: foodiehub/menu-service
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/menu_db?allowPublicKeyRetrieval=true&useSSL=false
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      <<: *depends-core
      redis:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health | grep -q UP"]

  order-service:
    <<: *service
    build: { context: .., args: { SERVICE: order-service } }
    image: foodiehub/order-service
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on: *depends-core
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health | grep -q UP"]

  payment-service:
    <<: *service
    build: { context: .., args: { SERVICE: payment-service } }
    image: foodiehub/payment-service
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-inr}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on: *depends-core
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/actuator/health | grep -q UP"]

  delivery-service:
    <<: *service
    build: { context: .., args: { SERVICE: delivery-service } }
    image: foodiehub/delivery-service
    environment:
      <<: [*common-env, *db-env]
      DB_URL: jdbc:mysql://mysql:3306/delivery_db?allowPublicKeyRetrieval=true&useSSL=false
    depends_on: *depends-core
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/actuator/health | grep -q UP"]

  notification-service:
    <<: *service
    build: { context: .., args: { SERVICE: notification-service } }
    image: foodiehub/notification-service
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/actuator/health | grep -q UP"]

  frontend:
    restart: unless-stopped
    build: { context: ../frontend }
    image: foodiehub/frontend
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    environment:
      API_UPSTREAM: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_healthy

  # Optional HTTPS with automatic Let's Encrypt certificates:
  #   set DOMAIN, HTTP_BIND=127.0.0.1 and HTTP_PORT=8000 in .env, then
  #   docker compose --profile tls up -d
  caddy:
    image: caddy:2.8-alpine
    profiles: [tls]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  mysql_data:
  kafka_data:
  caddy_data:
  caddy_config:
